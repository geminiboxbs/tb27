crest=(t,z)=>{const k=t.cr,sy=k&&k.sy;return`<span class=cr style="background:${k?`linear-gradient(120deg,${t.c} 50%,${k.c2} 50%)`:t.c}${k?`;border:0;border-radius:0;clip-path:${SH[k.sh]}`:''}${z?`;width:${z}px;height:${z}px;font-size:${z/(sy?1.7:2.4)}px`:''}">${sy?(IP[sy]?ic(sy,Math.round((z||22)*.58),'currentColor'):sy):t.n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`},ovb=n=>`<span class="ov ${n>=80?'g':n>=70?'a':n>=60?'s':'b'}">${n}</span>`,IC={Mecz:'ball',Skład:'shirt',Tabela:'chart',Transfery:'swap',Finanse:'coin',Akademia:'cap',Historia:'trophy',Klub:'shield'};
const rd=k=>({n:$('#nm'+k).value.trim().replace(/[<>&"'`]/g,'').slice(0,24),c:$('#c1'+k).value,cr:{c2:$('#c2'+k).value,sh:+$('#sh'+k).value,sy:$('#sy'+k).value}}),pv=k=>{$('#pv'+k).innerHTML=crest(rd(k),64)},
ed=(k,t)=>{const c=t.cr||{};return`<div class=ed><div id=pv${k}>${crest(t,64)}</div><label>Nazwa klubu<input id=nm${k} maxlength=24 placeholder="np. TB United" value="${t.n}" oninput="pv('${k}')"></label><label>Kolor 1<input type=color id=c1${k} value="${t.c}" oninput="pv('${k}')"></label><label>Kolor 2<input type=color id=c2${k} value="${c.c2||'#ffffff'}" oninput="pv('${k}')"></label><label>Kształt herbu<select id=sh${k} onchange="pv('${k}')">${['Tarcza','Koło','Romb','Sześciokąt'].map((x,i)=>`<option value=${i} ${c.sh==i?'selected':''}>${x}</option>`).join('')}</select></label><label>Symbol<select id=sy${k} onchange="pv('${k}')">${SYM.map(x=>`<option value="${x}" ${c.sy==x?'selected':''}>${LB[x]||'Inicjały'}</option>`).join('')}</select></label></div>`};
function svK(){const U=S.teams[S.club],r=rd('k');if(!r.n)r.n=U.n;Object.assign(U,r);save();render()}
function tK(U){return`<div class=c><h3>Mój klub</h3><p class=mu>Zmień nazwę, kolory, kształt herbu i symbol.</p>${ed('k',U)}<p><button class=p onclick="svK()">Zapisz herb i nazwę</button></p></div>`}

function tM(U){const m=S.fix[S.md].find(x=>x.includes(S.club)),h=m[0]==S.club,O=S.teams[m[h?1:0]],bt=(k,a,l)=>`<button class="${U[k]==a?'on':''}" onclick="U_('${k}','${a}')">${l}</button>`;
 return`<div class="c fx"><div class=mu>Kolejka ${S.md+1}/14 · ${h?ic('home',16)+' u siebie':ic('plane',16)+' wyjazd'}</div><div class=vs><div>${crest(h?U:O,56)}<b>${(h?U:O).n}</b></div><div class=mid>VS</div><div>${crest(h?O:U,56)}<b>${(h?O:U).n}</b></div></div><div class=bar><i style="width:${Math.round(ovr(U)/(ovr(U)+ovr(O))*100)}%"></i></div><p class=mu>Ocena składu: ${ovr(U)} (Ty) vs ${ovr(O)}</p><p>Formacja: ${FORMS.map(x=>bt('form',x,x)).join('')}</p><p>Styl: ${[['D','Obrona'],['B','Balans'],['A','Atak']].map(([k,l])=>bt('sty',k,l)).join('')}</p><button class=p onclick=play()>${ic('play',16,'currentColor')} Graj na żywo</button><button onclick=simU()>${ic('ff',16,'currentColor')} Symuluj</button></div>`+(S.res?`<div class=c><b>Ostatni mecz:</b> ${S.res}</div>`:'')+`<div class=c><b>Dziennik</b><br>${S.log.map(x=>`<span class=mu>${x}</span>`).join('<br>')||'<span class=mu>Brak wpisów.</span>'}</div>`}
function tS0(U){const X=xi(U),l=[...U.sq].sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.o-a.o);return`<p class=mu>Cała kadra (podświetleni: pierwszy skład).</p>`+tb(['Poz','Zawodnik','Wiek','OVR','Forma','Kond.','Gole','Wartość'],l.map(p=>[pg(p),p.n+(p.inj?` <span class=inj>${ic('med',14)}${p.inj}</span>`:''),p.age,ovb(p.o),frm(p.form),fit(p.fit),p.g,fm(val(p))]),i=>X.includes(l[i])?'xi':'')}
function tT(){const s=std();return tb(['#','Klub','M','Pkt','W','R','P','Bramki'],s.map(({t,i},k)=>[k+1,crest(t,20)+' '+t.n,t.w+t.d+t.l,t.pts,t.w,t.d,t.l,t.gf+':'+t.ga]),k=>s[k].i==S.club?'xi':'')}
function tR(U){return`<div class=c><b>Rynek transferowy</b> <span class=mu>· odświeża się co kolejkę · kadra ${U.sq.length}/26</span></div>`+tb(['Poz','Zawodnik','Wiek','OVR','Cena',''],S.mkt.map(p=>[pg(p),p.n,p.age,ovb(p.o),fm(p.pr),`<button onclick="buy('${p.id}')" ${S.bud<p.pr?'disabled':''}>Kup</button>`]))+`<div class=c><b>Sprzedaż</b> <span class=mu>· 85% wartości</span></div>`+tb(['Poz','Zawodnik','OVR','Cena',''],U.sq.map(p=>[pg(p),p.n,ovb(p.o),fm(Math.round(val(p)*.85)),`<button onclick="sell('${p.id}')">Sprzedaj</button>`]))}
function tF(U){return`<div class=c><b>Budżet:</b> ${fm(S.bud)}<br><span class=mu>Pensje: ${fm(Math.round(U.sq.reduce((s,p)=>s+val(p),0)*.008))} za kolejkę · stadion poz. ${S.stad}/4 (${12000+S.stad*8000} miejsc)</span></div><div class=c><b>Sponsor</b><br>${SP.map((s,i)=>`<button class="${S.sp==i?'on':''}" onclick="S.sp=${i};save();render()">${s.n}: ${s.b}k + ${s.w}k za wygraną</button>`).join('')}</div><div class=c><button onclick="up('stad')" ${S.stad>=4||S.bud<4000*S.stad?'disabled':''}>Rozbuduj stadion (${fm(4000*S.stad)})</button></div>`}
function tA(){return`<div class=c><b>Akademia poz. ${S.acad}/5</b> <button onclick="up('acad')" ${S.acad>=5||S.bud<1500*S.acad?'disabled':''}>Ulepsz (${fm(1500*S.acad)})</button><br><span class=mu>Nowe talenty pojawiają się co sezon.</span></div>`+tb(['Poz','Talent','Wiek','OVR',''],S.youth.map(p=>[pg(p),p.n,p.age,ovb(p.o),`<button onclick="promo('${p.id}')">Awansuj</button>`]))}
function tH(){return`<div class=c><b>${ic('trophy',18)} Mistrzostwa:</b> ${S.hist.filter(h=>h.pos==1).length}</div>`+tb(['Sezon','Miejsce','Pkt','Nagroda'],S.hist.map(h=>[h.s,h.pos,h.pts,fm(h.pr)]))+`<div class=c><b>Zadania i osiągnięcia</b><br>${T.map((t,i)=>`<span class="${S.ach[i]?'tr u':'mu'}">${S.ach[i]?ic('check',18):ic('box',18)}</span> ${t[0]} <span class=mu>(+${t[2]} k€)</span>`).join('<br>')}</div>`}
function menu(){return`<div class=hero><div class=brand>TB<b>27</b></div><p>Kariera menedżera: taktyka, mecze na żywo, transfery, finanse, akademia i sezony. Zapis w przeglądarce.</p></div>`+[1,2,3].map(n=>{const s=ld(n),j=s&&JSON.parse(s);return`<div class=c><b>Slot ${n}</b> `+(j?`· ${j.teams[j.club].n}, sezon ${j.season}, kolejka ${j.md+1}<br><button class=p onclick="load(${n})">Wczytaj</button><button onclick="if(this.dataset.s)del(${n});else{this.dataset.s=1;this.textContent='Na pewno?'}">Usuń</button>`:`· pusty<br><select id=s${n}>${CL.map((c,i)=>`<option value=${i}>${c[0]}</option>`).join('')}</select><details id=d${n}><summary>${ic('edit',16)} Własny herb i nazwa klubu (zastąpi wybrany klub)</summary>${ed(n,{n:'',c:'#2e8b57'})}</details><button class=p onclick="newG(${n},+$('#s${n}').value,$('#d${n}').open?rd(${n}):null)">Nowa kariera</button>`)+'</div>'}).join('')}
function render(){const a=$('#app');if(!S){a.innerHTML=menu();return}const U=S.teams[S.club];
 a.innerHTML=`<div class=top><div class=brand>TB<b>27</b></div>${crest(U,34)}<div class=tn><b>${U.n}</b><span class=mu>Sezon ${S.season} · kolejka ${S.md+1}/14</span></div><span class=chip>${ic('coin',16)} ${fm(S.bud)}</span><button title="Zapisz" onclick="save();this.innerHTML=ic('check',18)">${ic('save',18)}</button><button title="Menu" onclick="save();S=null;render()">${ic('menu',18)}</button></div><nav>${TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${ic(IC[t],16)} ${t}</button>`).join('')}</nav>`+({Mecz:tM,Skład:tS,Tabela:tT,Transfery:tR,Finanse:tF,Akademia:tA,Historia:tH,Klub:tK}[tab])(U)}
render();
